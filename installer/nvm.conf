# M_GROUP OpenRC configuration
export M_GROUP_HOST="${M_GROUP_HOST:-0.0.0.0}"
export M_GROUP_PORT="${M_GROUP_PORT:-8011}"
export M_GROUP_DATA_DIR="${M_GROUP_DATA_DIR:-/var/lib/M_GROUP}"
export M_GROUP_DB_PATH="${M_GROUP_DB_PATH:-/var/lib/M_GROUP/M_GROUP.db}"
export M_GROUP_USER="${M_GROUP_USER:-root}"
# REQUIRED for ESP32 provisioning. Set a strong random value.
export M_GROUP_ADMIN_TOKEN="${M_GROUP_ADMIN_TOKEN:-}"
