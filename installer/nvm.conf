# M-Group OpenRC configuration
export M-Group_HOST="${M-Group_HOST:-0.0.0.0}"
export M-Group_PORT="${M-Group_PORT:-8011}"
export M-Group_DATA_DIR="${M-Group_DATA_DIR:-/var/lib/M-Group}"
export M-Group_DB_PATH="${M-Group_DB_PATH:-/var/lib/M-Group/M-Group.db}"
export M-Group_USER="${M-Group_USER:-root}"
# REQUIRED for ESP32 provisioning. Set a strong random value.
export M-Group_ADMIN_TOKEN="${M-Group_ADMIN_TOKEN:-}"
