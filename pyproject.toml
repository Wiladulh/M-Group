[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"

[project]
name="m-group-platform"
version="0.1.0"
description="Portable cooperative financial, NFC payment and vending platform"
requires-python=">=3.10"
dependencies=["fastapi>=0.115,<1","uvicorn[standard]>=0.30,<1","python-multipart>=0.0.9,<1","openpyxl>=3.1,<4"]

[project.scripts]
m-group="app.cli:main"

[tool.setuptools.packages.find]
include=["app*"]

[tool.setuptools.package-data]
app = ["webui/index.html", "webui/assets/**/*", "webui/pages/*.html", "migrations/*.sql"]
