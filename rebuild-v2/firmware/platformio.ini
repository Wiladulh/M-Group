[platformio]
default_envs = cashier, vending
src_dir = src
include_dir = include

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
upload_speed = 460800
lib_deps =
  bblanchon/ArduinoJson@^7.2.1
  miguelbalboa/MFRC522@^1.4.12
  adafruit/Adafruit PN532@^1.3.4
  marcoschwartz/LiquidCrystal_I2C@^1.1.4
  chris--a/Keypad@^3.1.1
  adafruit/Adafruit GFX Library@^1.11.11
  adafruit/Adafruit SSD1306@^2.5.13
  madhephaestus/ESP32Servo@^3.0.6
  bodmer/TJpg_Decoder@^1.1.0

[env:cashier]
board = esp32dev
build_flags = -DDEVICE_CASHIER=1
build_src_filter = +<common.cpp> +<cashier.cpp> -<vending.cpp>

[env:vending]
board = esp32-s3-devkitc-1
board_build.flash_size = 4MB
board_build.partitions = partitions/mgroup_vending_4mb.csv
board_build.filesystem = littlefs
build_flags = -DDEVICE_VENDING=1
build_src_filter = +<common.cpp> +<vending.cpp> -<cashier.cpp>
