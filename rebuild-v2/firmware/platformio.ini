[platformio]
default_envs = cashier, vending
src_dir = src
include_dir = include

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
upload_speed = 460800
lib_deps =
  bblanchon/ArduinoJson@^7.2.1
  miguelbalboa/MFRC522@^1.4.12
  adafruit/Adafruit PN532@^1.3.4
  marcoschwartz/LiquidCrystal_I2C@^1.1.4
  chris--a/Keypad@^3.1.1
  adafruit/Adafruit GFX Library@^1.11.11
  adafruit/Adafruit SSD1306@^2.5.13
  madhephaestus/ESP32Servo@^3.0.6

[env:cashier]
board = esp32dev
build_flags = -DDEVICE_CASHIER=1
build_src_filter = +<common.cpp> +<cashier.cpp> -<vending.cpp>

[env:vending]
board = esp32-s3-devkitc-1
build_flags = -DDEVICE_VENDING=1
build_src_filter = +<common.cpp> +<vending.cpp> -<cashier.cpp>


; Standalone bench firmware: ESP32 + 0.96" SSD1306 I2C OLED + 4x4 keypad + RC522.
; This target does not initialize the server runtime or perform financial operations.
[env:cashier_oled_test]
board = esp32dev
build_flags = -DDEVICE_CASHIER_OLED_TEST=1
build_src_filter = +<cashier_oled_test.cpp> -<common.cpp> -<cashier.cpp> -<vending.cpp>
