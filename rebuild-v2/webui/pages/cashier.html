<div id="tab-cashier" class="tab-pane">
  <section class="section">
    <h2>Konfigurasi Terminal Cashier</h2>
    <p class="hint">Setiap terminal memiliki satu operator dan satu rekening settlement merchant. PIN operator tidak pernah ditampilkan kembali.</p>
    <form id="cashierConfigForm">
      <label>Terminal Cashier<select id="cashierConfigDevice" required><option value="">Muat terminal Cashier</option></select></label>
      <label>ID operator<input id="cashierOperatorId" maxlength="128" required></label>
      <label>Nama operator<input id="cashierOperatorName" maxlength="120" required></label>
      <label>PIN operator (6–12 digit)<input id="cashierOperatorPin" type="password" inputmode="numeric" minlength="6" maxlength="12" pattern="[0-9]{6,12}" required></label>
      <label>Rekening settlement<select id="cashierSettlementAccount" required><option value="">Muat rekening merchant</option></select></label>
      <button type="submit">Simpan Konfigurasi Cashier</button>
    </form>
    <div id="cashierConfigResult" class="result"></div>
  </section>
  <section class="section">
    <div class="panelhead"><div><h2>Riwayat Cashier</h2><p class="hint">Riwayat penerimaan dan pembayaran dari perangkat Cashier, bersumber dari server.</p></div></div>
    <form id="cashierForm">
      <label>Perangkat Cashier
        <select id="cashierDevice"><option value="ALL">Semua Cashier</option></select>
      </label>
      <label>Periode
        <select id="cashierPeriod">
          <option value="day">Hari ini</option>
          <option value="week">Minggu ini</option>
          <option value="month">Bulan ini</option>
        </select>
      </label>
      <label>Jenis transaksi
        <select id="cashierType">
          <option value="ALL">Semua jenis</option>
          <option value="DEPOSIT">Penerimaan / Top-up</option>
          <option value="PAYMENT">Pembayaran</option>
        </select>
      </label>
      <label>Status
        <select id="cashierStatus">
          <option value="ALL">Semua status</option>
          <option value="succeeded">Berhasil</option>
          <option value="pending">Menunggu</option>
          <option value="declined">Ditolak</option>
          <option value="reversed">Refund</option>
        </select>
      </label>
      <button type="submit">Tampilkan Transaksi</button>
    </form>
    <div id="cashierMetrics" class="grid" style="margin-top:14px"></div>
    <div id="cashierResult" class="scroll" style="margin-top:12px"></div>
    <div id="cashierDetail" class="result"></div>
  </section>
</div>
