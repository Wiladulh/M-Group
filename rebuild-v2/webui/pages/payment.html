<div id="tab-payment" class="tab-pane">
  <section class="section">
    <h2>Riwayat Pembayaran</h2>
    <p class="hint">Pembayaran aktual dibuat oleh terminal Cashier/Vending yang terautentikasi. Dashboard admin hanya menelusuri transaksi; halaman ini tidak dapat mendebit kartu secara manual.</p>
    <form id="paymentForm">
      <label>Periode<select id="paymentPeriod"><option value="week">Minggu ini</option><option value="day">Hari ini</option><option value="month">Bulan ini</option><option value="all">Semua waktu</option></select></label>
      <label>Status<select id="paymentStatusFilter"><option value="ALL">Semua status</option><option value="succeeded">Berhasil</option><option value="pending">Menunggu</option><option value="declined">Ditolak</option><option value="reversed">Dikembalikan</option></select></label>
      <label>Metode/source<select id="paymentMethodFilter"><option value="ALL">Semua sumber</option><option value="CASHIER">Cashier</option><option value="VENDING">Vending</option><option value="TOPUP">Top Up</option></select></label>
      <input id="paymentSearch" placeholder="Cari Member ID, hardware, transaksi, request">
      <button type="submit">Cari Transaksi</button>
    </form>
    <div id="paymentResult" class="result"></div>
    <div id="payments" class="scroll" style="margin-top:12px"></div>
  </section>
</div>
