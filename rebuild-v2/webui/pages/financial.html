<div id="tab-financial" class="tab-pane">
  <section class="section">
    <h2>Saldo & Rekening</h2>
    <div id="accounts" class="scroll"></div>
  </section>
  <section class="section">
    <h2>Top Up Saldo Member</h2>
    <div class="hint">Member menyetor uang tunai kepada Admin. Setelah uang diterima, Admin mengisi nominal dan keterangan penerimaan, lalu mengonfirmasi sebelum saldo ditambahkan dan dicatat di Ledger.</div>
    <form id="financialForm">
      <label>Member<select id="account" required><option value="">Muat member setelah login</option></select></label>
      <label>Nominal top-up (Rp)<input id="amount" type="number" min="1" step="1" placeholder="Contoh: 50000" required></label>
      <label>Keterangan penerimaan uang tunai<input id="reference" maxlength="200" placeholder="Contoh: Setoran tunai loket pagi"></label>
      <input id="financialRequestId" type="hidden">
      <button type="submit">Lanjutkan</button>
    </form>
    <div id="financialResult" class="result" role="status" aria-live="polite"></div>
    <h3>Riwayat Ledger Akun</h3>
    <div id="financialLedger" class="scroll"></div>
  </section>
</div>
