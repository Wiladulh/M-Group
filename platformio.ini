[platformio]
default_envs = esp32dev

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
lib_deps =
  adafruit/Adafruit PN532
  miguelbalboa/MFRC522
  chris--a/Keypad
  marcoschwartz/LiquidCrystal_I2C
  adafruit/Adafruit GFX Library
  adafruit/Adafruit SSD1306
  madhephaestus/ESP32Servo
  ESP32Async/AsyncTCP
  ESP32Async/ESPAsyncWebServer

[env:esp32dev]
board = esp32dev
; Cashier setup portal and NFC stack exceed the default 1.25 MiB app slot.
; Keep OTA capability while using the larger app slots from the min_spiffs layout.
board_build.partitions = mgroup_ota_images.csv

[env:esp32-s3]
board = esp32-s3-devkitc-1
board_build.partitions = mgroup_ota_images.csv
