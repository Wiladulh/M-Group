name: ESP32-S3 Vending Build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "esp32/vending/**"
      - "platformio.ini"
      - ".github/workflows/esp32-vending.yml"
      - "app/api/routes.py"
      - "app/device/**"
      - "app/vending/**"
      - "app/payment/service.py"
      - "app/financial/service.py"
      - "app/identity/service.py"
      - "app/core/db.py"
      - "tests/test_vending_firmware_contract.py"
      - "tests/test_api_firmware_contract.py"
  push:
    paths:
      - "esp32/vending/**"
      - "platformio.ini"
      - ".github/workflows/esp32-vending.yml"
      - "app/api/routes.py"
      - "app/device/**"
      - "app/vending/**"
      - "app/payment/service.py"
      - "app/financial/service.py"
      - "app/identity/service.py"
      - "app/core/db.py"
      - "tests/test_vending_firmware_contract.py"
      - "tests/test_api_firmware_contract.py"

jobs:
  build-vending:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade platformio

      - name: Stage Vending Sources
        run: |
          mkdir -p src
          cp esp32/vending/*.ino src/
          cp esp32/vending/*.h src/
          cp esp32/common/*.h src/

      - name: Build ESP32-S3 Vending
        run: pio run -e esp32-s3

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: m-group-esp32-s3-vending-firmware
          path: .pio/build/esp32-s3/firmware.bin
