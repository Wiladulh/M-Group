name: Rebuild v2 - Clean Room

on:
  push:
    branches:
      - rebuild/clean-room-v2
    paths:
      - 'rebuild-v2/**'
      - '.github/workflows/rebuild-v2.yml'
  pull_request:
    paths:
      - 'rebuild-v2/**'
      - '.github/workflows/rebuild-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rebuild-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  schema-contract:
    name: Clean-install schema and contract tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rebuild-v2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate clean-install schema
        run: python -m unittest discover -s tests -p 'test_*.py' -v
