name: Rebuild v2 - Clean Room

on:
  push:
    branches:
      - rebuild/clean-room-v2
    paths:
      - 'rebuild-v2/**'
      - '.github/workflows/rebuild-v2.yml'
  pull_request:
    paths:
      - 'rebuild-v2/**'
      - '.github/workflows/rebuild-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rebuild-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  schema-contract:
    name: Server, schema, and contract tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rebuild-v2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Validate server and clean-install schema
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  firmware-build:
    name: ESP32 v2 firmware compile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio
      - name: Compile Cashier ESP32 firmware
        working-directory: rebuild-v2/firmware
        run: pio run -e cashier
      - name: Compile Vending ESP32-S3 firmware
        working-directory: rebuild-v2/firmware
        run: pio run -e vending
