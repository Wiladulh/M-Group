name: Rebuild v2 - Clean Room

on:
  push:
    branches:
      - rebuild/clean-room-v2
    paths:
      - 'rebuild-v2/**'
      - '.github/workflows/rebuild-v2.yml'
  pull_request:
    paths:
      - 'rebuild-v2/**'
      - '.github/workflows/rebuild-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rebuild-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  schema-contract:
    name: Server, schema, and contract tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rebuild-v2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate v2 installer shell syntax
        run: sh -n ops/install-v2.sh
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Validate server and clean-install schema
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  firmware-build:
    name: ESP32 v2 firmware compile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio
      - name: Compile Cashier ESP32 firmware
        working-directory: rebuild-v2/firmware
        run: pio run -e cashier
      - name: Compile Vending ESP32-S3 firmware
        working-directory: rebuild-v2/firmware
        run: pio run -e vending

  webui-browser-e2e:
    name: WebUI browser end-to-end tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend and browser-test dependencies
        run: |
          python -m pip install -r rebuild-v2/backend/requirements.txt
          python -m pip install -r rebuild-v2/tests/requirements-browser.txt
          python -m playwright install --with-deps chromium
      - name: Start isolated v2 server
        working-directory: rebuild-v2/backend
        env:
          MGROUP_DB_PATH: /tmp/mgroup-v2-browser.sqlite3
          MGROUP_ADMIN_USERNAME: admin
          MGROUP_ADMIN_PASSWORD: Browser-Test-Admin-Password-123
          MGROUP_DEVICE_KEY_PEPPER: browser-test-only-pepper
        run: |
          nohup python -m uvicorn mgroup_backend.main:app --host 127.0.0.1 --port 8765 > /tmp/mgroup-v2-browser.log 2>&1 &
          for attempt in $(seq 1 40); do
            if curl --silent --fail http://127.0.0.1:8765/api/v2/health; then exit 0; fi
            sleep 1
          done
          cat /tmp/mgroup-v2-browser.log
          exit 1
      - name: Run Chromium browser workflows
        run: python rebuild-v2/tests/browser_e2e.py
