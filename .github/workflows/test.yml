name: Test
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: pip install pytest httpx build
      - run: pytest -q
      - run: python -m build --wheel
      - run: python -c "import glob,zipfile; p=glob.glob('dist/*.whl')[0]; z=zipfile.ZipFile(p); names=z.namelist(); required=['app/webui/index.html','app/webui/pages/dashboard.html','app/webui/assets/js/app.js']; missing=[x for x in required if x not in names]; assert not missing, f'Missing packaged WebUI files: {missing}'"
