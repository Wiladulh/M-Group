<div id="tab-vending" class="tab-pane">
  <section class="section">
    <h2>Vending / Machine</h2>
    <div id="machines" class="scroll"></div>
  </section>
  <section class="section">
    <h2>Inventory Produk</h2>
    <div id="products" class="scroll"></div>
    <div class="hint">Setiap mesin memiliki lima Product ID tetap (1–5). Slot dan servo dipetakan otomatis; keduanya tidak dapat diedit terpisah.</div>
    <form id="productForm" style="margin-top:12px">
      <input id="vendingAdminToken" type="password" placeholder="Admin Token" autocomplete="current-password" required>
      <button id="loadVendingMachines" type="button">Muat Daftar Mesin</button>
      <select id="machineId" required><option value="">Pilih mesin setelah daftar dimuat</option></select>
      <select id="productId" required><option value="">Pilih Product ID</option><option value="1">Product ID 1</option><option value="2">Product ID 2</option><option value="3">Product ID 3</option><option value="4">Product ID 4</option><option value="5">Product ID 5</option></select>
      <input id="productName" placeholder="Nama produk" required>
      <input id="productPrice" type="number" min="1" placeholder="Harga" required>
      <input id="productStock" type="number" min="0" placeholder="Stok saat ini" required>
      <input id="productCapacity" type="number" min="0" placeholder="Kapasitas slot" required>
      <label class="check">
        <input id="productEnabled" type="checkbox" checked> Aktif
      </label>
      <button>Simpan Produk</button>
    </form>
    <div id="productResult" class="result"></div>
  </section>
</div>
