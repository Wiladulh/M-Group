<div id="tab-financial" class="tab-pane">
  <section class="section">
    <h2>Saldo & Rekening</h2>
    <div id="accounts" class="scroll"></div>
  </section>
  <section class="section">
    <h2>Deposit / Penarikan</h2>
    <div class="hint">Gunakan Account ID anggota. Mutasi saldo memerlukan Admin Token.</div>
    <form id="financialForm">
      <input id="financialAdminToken" type="hidden" value="session" data-session-token>
      <input id="account" placeholder="Account ID" required>
      <input id="amount" type="number" min="1" placeholder="Jumlah" required>
      <select id="direction">
        <option value="credit">Deposit / Kredit</option>
        <option value="debit">Penarikan / Debit</option>
      </select>
      <input id="reference" placeholder="Referensi">
      <button>Proses</button>
    </form>
    <div id="financialResult" class="result"></div>
  </section>
  <section class="section">
    <h2>Pinjaman</h2>
    <div id="loans" class="scroll"></div>
  </section>
</div>
