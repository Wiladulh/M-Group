<div id="tab-financial" class="tab-pane">
  <section class="section">
    <h2>Saldo & Rekening</h2>
    <div id="accounts" class="scroll"></div>
  </section>
  <section class="section">
    <h2>Deposit / Penarikan</h2>
    <div class="hint">Gunakan Account ID anggota. Mutasi saldo memerlukan sesi admin yang aktif.</div>
    <form id="financialForm">
      <input id="financialAdminToken" type="hidden" value="session" data-session-token>
      <select id="account" required><option value="">Muat akun setelah login</option></select>
      <input id="amount" type="number" min="1" step="1" placeholder="Jumlah (IDR)" required>
      <select id="direction">
        <option value="credit">Deposit / Kredit</option>
        <option value="debit">Penarikan / Debit</option>
      </select>
      <input id="reference" placeholder="Referensi transaksi unik" required>
      <button>Proses</button>
    </form>
    <div id="financialResult" class="result"></div>
    <h3>Riwayat Ledger Akun</h3>
    <div id="financialLedger" class="scroll"></div>
  </section>
  <section class="section">
    <h2>Pinjaman</h2>
    <div id="loans" class="scroll"></div>
  </section>
</div>
