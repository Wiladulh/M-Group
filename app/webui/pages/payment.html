<div id="tab-pembayaran" class="tab-pane">
  <section class="section">
    <h2>Pembayaran NFC / QRIS</h2>
    <div class="hint">Pembayaran manual memerlukan Admin Token. Transaksi NFC juga memerlukan PIN anggota; QRIS belum diaktifkan sebagai jalur pembayaran mandiri.</div>
    <form id="paymentForm">
      <input id="paymentAdminToken" type="password" placeholder="Admin Token" autocomplete="current-password" required>
      <input id="credential" placeholder="Credential ID" required>
      <input id="payaccount" placeholder="Account ID" required>
      <input id="payamount" type="number" min="1" placeholder="Jumlah" required>
      <input id="paypin" type="password" inputmode="numeric" minlength="4" maxlength="6" placeholder="PIN anggota (NFC)" autocomplete="off">
      <select id="method">
        <option>NFC</option>
        <option>QRIS</option>
        <option>CASH</option>
      </select>
      <input id="provider" placeholder="Provider" value="local">
      <input id="idem" placeholder="Idempotency key">
      <button>Bayar</button>
    </form>
    <div id="paymentResult" class="result"></div>
  </section>
  <section class="section">
    <h2>Transaksi Pembayaran</h2>
    <div id="payments" class="scroll"></div>
  </section>
</div>
