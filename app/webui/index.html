<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>M-Group — Membership & Vending Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/app.css">
</head>
<body>
<header><div class="top"><div><div class="brand">M-Group</div><div class="sub">Dashboard Koperasi</div></div><div id="status" class="status">Memuat...</div></div></header>
<div class="nav-container"><nav>
<button class="tab-btn active" data-tab="dashboard">Ringkasan</button>
<button class="tab-btn" data-tab="financial">Keuangan</button>
<button class="tab-btn" data-tab="member">Anggota</button>
<button class="tab-btn" data-tab="payment">Pembayaran</button>
<button class="tab-btn" data-tab="vending">Vending</button>
<button class="tab-btn" data-tab="devices">Perangkat</button>
<button class="tab-btn" data-tab="audit">Audit & Backup</button>
</nav></div>
<main><div id="page-dashboard"></div><div id="page-financial"></div><div id="page-member"></div><div id="page-payment"></div><div id="page-vending"></div><div id="page-audit"></div><div id="page-devices"></div></main>
<script>
(async()=>{
 const pages=["dashboard","financial","member","payment","vending","audit","devices"];
 await Promise.all(pages.map(async name=>{
   const r=await fetch('/pages/'+name+'.html');
   if(!r.ok)throw new Error('Gagal memuat halaman '+name);
   document.getElementById('page-'+name).outerHTML=await r.text();
 }));
 const s=document.createElement('script');s.src='/assets/js/app.js';s.onerror=()=>{document.getElementById('status').textContent='● Gagal memuat JavaScript WebUI';};document.body.appendChild(s);
})().catch(e=>{document.getElementById('status').textContent='● WebUI gagal dimuat';console.error(e)});
window.addEventListener('error',e=>{const status=document.getElementById('status');if(status)status.textContent='● Kesalahan JavaScript WebUI';console.error('M-Group WebUI error:',e.message,e.filename,e.lineno)});
window.addEventListener('unhandledrejection',e=>{const status=document.getElementById('status');if(status)status.textContent='● Kesalahan proses WebUI';console.error('M-Group WebUI rejected promise:',e.reason)});
</script>
</body></html>
